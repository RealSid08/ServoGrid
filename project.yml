name: ServoGrid
options:
  bundleIdPrefix: com.sidkrishnan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  ServoGrid:
    type: application
    platform: iOS
    sources:
      - path: ServoGrid
    resources:
      - path: ServoGrid/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGrid
        PRODUCT_NAME: ServoGrid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: ServoGrid
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: ServoGrid uses your location only to show fuel prices near you.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: fetch
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: com.sidkrishnan.ServoGrid.refresh
        GENERATE_INFOPLIST_FILE: YES
  ServoGridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServoGridTests
    dependencies:
      - target: ServoGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGridTests
        GENERATE_INFOPLIST_FILE: YES
  ServoGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ServoGridUITests
    dependencies:
      - target: ServoGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGridUITests
        TEST_TARGET_NAME: ServoGrid
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ServoGrid:
    build:
      targets:
        ServoGrid: all
        ServoGridTests: [test]
        ServoGridUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: ServoGridTests
          parallelizable: false
        - name: ServoGridUITests
          parallelizable: false

