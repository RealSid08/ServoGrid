name: ServoGrid
options:
  bundleIdPrefix: com.sidkrishnan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  ServoGrid:
    type: application
    platform: iOS
    sources:
      - path: ServoGrid
    resources:
      - path: ServoGrid/Resources
    info:
      path: ServoGrid/Resources/Info.plist
      properties:
        CFBundleDisplayName: ServoGrid
        LSApplicationCategoryType: public.app-category.navigation
        NSLocationWhenInUseUsageDescription: ServoGrid uses your location only to show fuel prices near you.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.sidkrishnan.ServoGrid.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGrid
        PRODUCT_NAME: ServoGrid
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  ServoGridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServoGridTests
    dependencies:
      - target: ServoGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGridTests
        GENERATE_INFOPLIST_FILE: YES
  ServoGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ServoGridUITests
    dependencies:
      - target: ServoGrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidkrishnan.ServoGridUITests
        TEST_TARGET_NAME: ServoGrid
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ServoGrid:
    build:
      targets:
        ServoGrid: all
        ServoGridTests: [test]
        ServoGridUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: ServoGridTests
          parallelizable: false
        - name: ServoGridUITests
          parallelizable: false
